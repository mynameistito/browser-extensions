name: CI

on:
  pull_request:
  push:
    branches:
      - init

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - typecheck
          - test
          - check
          - build
          - knip
    name: ${{ matrix.task }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require the persistent Chrome key for init-branch builds
        if: github.event_name == 'push' && matrix.task == 'build'
        env:
          WXT_CHROME_KEY: ${{ secrets.NEW_TAB_WXT_CHROME_KEY }}
        run: |
          if [ -z "$WXT_CHROME_KEY" ]; then
            echo "::error::Set the WXT_CHROME_KEY Actions secret before pushing to init."
            exit 1
          fi

      - name: Run task
        run: bun run ${{ matrix.task }}
        env:
          WXT_CHROME_KEY: ${{ github.event_name == 'push' && matrix.task == 'build' && secrets.NEW_TAB_WXT_CHROME_KEY || '' }}

      - name: Verify the persistent Chrome key is in the build
        if: github.event_name == 'push' && matrix.task == 'build'
        run: |
          node -e 'const manifest = JSON.parse(require("node:fs").readFileSync(".output/chrome-mv3/manifest.json", "utf8")); if (!manifest.key) { console.error("Chrome build is missing manifest.key"); process.exit(1); }'
