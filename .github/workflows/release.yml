name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      has-changesets: ${{ steps.changesets.outputs['has-changesets'] }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run prepare:wxt
      - name: Build release matrix from extension catalog
        id: matrix
        run: echo "matrix=$(bun scripts/extension-catalog.ts --matrix)" >> "$GITHUB_OUTPUT"
      - name: Create or update version pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version
          create-github-releases: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: version
    if: needs.version.outputs['has-changesets'] == 'false'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run prepare:wxt
      - name: Release keyed extension
        if: ${{ matrix.chromeSigningSecret }}
        run: bun run --filter ${{ matrix.app }} ci:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_CHROME_KEY: "1"
          WXT_CHROME_KEY: ${{ secrets[matrix.chromeSigningSecret] }}

      - name: Release extension without signing key
        if: ${{ !matrix.chromeSigningSecret }}
        run: bun run --filter ${{ matrix.app }} ci:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
