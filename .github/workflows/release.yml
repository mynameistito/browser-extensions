name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      has-changesets: ${{ steps.changesets.outputs['has-changesets'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run prepare:wxt
      - name: Create or update version pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version
          create-github-releases: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-hide-email:
    needs: version
    if: needs.version.outputs['has-changesets'] == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run prepare:wxt
      - run: bun run --filter hide-email-ext ci:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_CHROME_KEY: "1"
          WXT_CHROME_KEY: ${{ secrets.HIDE_EMAIL_WXT_CHROME_KEY }}

  release-quote-viewer:
    needs: version
    if: needs.version.outputs['has-changesets'] == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run prepare:wxt
      - run: bun run --filter quote-viewer ci:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_CHROME_KEY: "1"
          WXT_CHROME_KEY: ${{ secrets.QUOTE_VIEWER_WXT_CHROME_KEY }}

  release-new-tab:
    needs: version
    if: needs.version.outputs['has-changesets'] == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run prepare:wxt
      - run: bun run --filter new-tab-ext ci:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_CHROME_KEY: "1"
          WXT_CHROME_KEY: ${{ secrets.NEW_TAB_WXT_CHROME_KEY }}

  release-hide-ip:
    needs: version
    if: needs.version.outputs['has-changesets'] == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run prepare:wxt
      - run: bun run --filter hide-ip-ext ci:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-ig-video-controls:
    needs: version
    if: needs.version.outputs['has-changesets'] == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run prepare:wxt
      - run: bun run --filter ig-video-controls ci:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_CHROME_KEY: "1"
          WXT_CHROME_KEY: ${{ secrets.IG_VIDEO_CONTROLS_WXT_CHROME_KEY }}

  release-better-history:
    needs: version
    if: needs.version.outputs['has-changesets'] == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run prepare:wxt
      - run: bun run --filter better-history ci:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
