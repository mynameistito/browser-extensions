name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Changesets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs['has-changesets'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create or update version PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version
          create-github-releases: false
          github-token: ${{ github.token }}

  detect-releases:
    name: Detect changed app versions
    needs: version
    if: needs.version.outputs['has-changesets'] == 'false'
    runs-on: ubuntu-24.04
    outputs:
      changed-packages: ${{ steps.detect.outputs.changed-packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Find apps with a version change
        id: detect
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, readdirSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';

          const appsDirectory = 'apps';
          const changedPackages = [];

          for (const directory of readdirSync(appsDirectory, { withFileTypes: true })) {
            if (!directory.isDirectory()) continue;

            const packagePath = path.posix.join(appsDirectory, directory.name, 'package.json');
            let current;
            try {
              current = JSON.parse(readFileSync(packagePath, 'utf8'));
            } catch {
              continue;
            }

            let previous;
            try {
              previous = JSON.parse(execFileSync('git', ['show', `HEAD^:${packagePath}`], { encoding: 'utf8' }));
            } catch {
              // A newly added app has no previous package manifest and needs an initial release.
            }

            if (previous?.version !== current.version) changedPackages.push(current.name);
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `changed-packages=${JSON.stringify(changedPackages)}\n`);
          NODE

  release:
    name: Release / ${{ matrix.package }}
    needs: [version, detect-releases]
    if: >-
      needs.version.outputs['has-changesets'] == 'false' && contains(fromJSON(needs.detect-releases.outputs.changed-packages), matrix.package)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - package: hide-email-ext
            chrome-secret: HIDE_EMAIL_WXT_CHROME_KEY
          - package: quote-viewer
            chrome-secret: QUOTE_VIEWER_WXT_CHROME_KEY
          - package: new-tab-ext
            chrome-secret: NEW_TAB_WXT_CHROME_KEY
          - package: hide-ip-ext
            chrome-secret: HIDE_IP_WXT_CHROME_KEY
          - package: ig-video-controls
            chrome-secret: IG_VIDEO_CONTROLS_WXT_CHROME_KEY
          - package: better-history
            chrome-secret: BETTER_HISTORY_WXT_CHROME_KEY
          - package: github-settings-repo-copy
            chrome-secret: WXT_GITHUB_SETTINGS_REPO_COPY_CHROME_KEY
          - package: mute-tab-manager
            chrome-secret: MUTE_TAB_MANAGER_WXT_CHROME_KEY
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Postinstall
        run: bun run --filter "${{ matrix.package }}" postinstall
        env:
          WXT_CHROME_KEY: ${{ secrets[matrix.chrome-secret] }}

      - name: Release
        run: bun run --filter "${{ matrix.package }}" ci:release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRE_CHROME_KEY: "1"
          WXT_CHROME_KEY: ${{ secrets[matrix.chrome-secret] }}
