name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: release-main
  queue: max

permissions:
  contents: read

jobs:
  version:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    name: Changesets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs['has-changesets'] || steps.stale.outputs.has-changesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check whether this commit is still main
        id: stale
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$main_sha" == "$CI_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            # Match the Changesets action's has-changesets output without updating its PR.
            if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit | grep -q .; then
              echo "has-changesets=true" >> "$GITHUB_OUTPUT"
            else
              echo "has-changesets=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Setup Bun
        if: steps.stale.outputs.current == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        if: steps.stale.outputs.current == 'true'
        run: bun install --frozen-lockfile

      - name: Create or update version PR
        id: changesets
        if: steps.stale.outputs.current == 'true'
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version
          create-github-releases: false
          github-token: ${{ github.token }}

  detect-releases:
    name: Detect changed app versions
    needs: version
    if: needs.version.outputs['has-changesets'] == 'false'
    runs-on: ubuntu-24.04
    outputs:
      has-releases: ${{ steps.detect.outputs.has-releases }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Build matrix for changed app versions
        id: detect
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, readdirSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';

          const appsDirectory = 'apps';
          const releaseSecrets = {
            'better-history': 'BETTER_HISTORY_WXT_CHROME_KEY',
            'github-settings-repo-copy': 'WXT_GITHUB_SETTINGS_REPO_COPY_CHROME_KEY',
            'hide-email-ext': 'HIDE_EMAIL_WXT_CHROME_KEY',
            'hide-ip-ext': 'HIDE_IP_WXT_CHROME_KEY',
            'ig-video-controls': 'IG_VIDEO_CONTROLS_WXT_CHROME_KEY',
            'mute-tab-manager': 'MUTE_TAB_MANAGER_WXT_CHROME_KEY',
            'new-tab-ext': 'NEW_TAB_WXT_CHROME_KEY',
            'quote-viewer': 'QUOTE_VIEWER_WXT_CHROME_KEY',
          };
          const packagesToRelease = [];

          for (const directory of readdirSync(appsDirectory, { withFileTypes: true })) {
            if (!directory.isDirectory()) continue;

            const packagePath = path.posix.join(appsDirectory, directory.name, 'package.json');
            let current;
            try {
              current = JSON.parse(readFileSync(packagePath, 'utf8'));
            } catch {
              continue;
            }

            // The docs site deploys through Alchemy, not the extension ZIP release flow.
            if (current.name === 'web') continue;

            let previous;
            try {
              previous = JSON.parse(execFileSync('git', ['show', `HEAD^:${packagePath}`], { encoding: 'utf8' }));
            } catch {
              // A newly added app has no previous package manifest and needs an initial release.
            }

            if (previous?.version !== current.version) {
              const chromeSecret = releaseSecrets[current.name];

              if (chromeSecret === undefined) {
                throw new Error(`No Chrome signing secret is configured for ${current.name}.`);
              }

              packagesToRelease.push({
                package: current.name,
                'chrome-secret': chromeSecret,
              });
            }
          }

          const outputPath = process.env.GITHUB_OUTPUT;

          if (outputPath === undefined) throw new Error('GITHUB_OUTPUT is not set.');

          appendFileSync(
            outputPath,
            `has-releases=${String(packagesToRelease.length > 0)}\nmatrix=${JSON.stringify({ include: packagesToRelease })}\n`
          );
          NODE

  release:
    name: Release / ${{ matrix.package }}
    needs: [version, detect-releases]
    if: >-
      needs.version.outputs['has-changesets'] == 'false' && needs.detect-releases.outputs['has-releases'] == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.detect-releases.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Postinstall
        run: bun run --filter "${{ matrix.package }}" postinstall
        env:
          WXT_CHROME_KEY: ${{ secrets[matrix.chrome-secret] }}

      - name: Release
        run: bun run --filter "${{ matrix.package }}" ci:release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRE_CHROME_KEY: "1"
          WXT_CHROME_KEY: ${{ secrets[matrix.chrome-secret] }}
