name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.task }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        task: [check, typecheck, test, build, knip]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.task == 'test' && '0' || '1' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-1.4.2-
      - run: bun install --frozen-lockfile
      - name: Prepare WXT types
        if: matrix.task != 'build'
        run: bun run prepare:wxt
      - name: Detect documentation-only changes
        id: scope
        if: matrix.task == 'test' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          docs_only=false
          if changes=$(git diff --no-renames --name-only "$BASE_SHA" HEAD) && [[ -n "$changes" ]]; then
            docs_only=true
            while IFS= read -r file; do
              if [[ "$file" != apps/web/docs/* ]]; then
                docs_only=false
                break
              fi
            done <<< "$changes"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      - name: Run root tests for documentation-only changes
        if: matrix.task == 'test' && steps.scope.outputs.docs_only == 'true'
        run: bun run test:root
      - run: bun run ${{ matrix.task }}
        if: matrix.task != 'test' || steps.scope.outputs.docs_only != 'true'

      - name: Build the credential-free Cloudflare preview bundle
        if: matrix.task == 'build'
        run: bun run --filter web build:preview-artifact

      - name: Upload the Cloudflare preview bundle
        if: matrix.task == 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alchemy-worker
          path: apps/web/.output/alchemy-worker/
          if-no-files-found: error
