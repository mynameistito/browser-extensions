name: CI

on:
  pull_request:
  push:
    branches: [main, init]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.task }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        task: [check, typecheck, test, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run prepare:wxt
      - if: github.event_name != 'push' || github.ref != 'refs/heads/init' || matrix.task != 'build'
        run: bun run ${{ matrix.task }}

  new-tab-knip:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/init')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --filter new-tab-ext knip

  new-tab-init-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/init'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Require the persistent Chrome key for init-branch builds
        env:
          WXT_CHROME_KEY: ${{ secrets.NEW_TAB_WXT_CHROME_KEY }}
        run: |
          if [ -z "$WXT_CHROME_KEY" ]; then
            echo "::error::Set the NEW_TAB_WXT_CHROME_KEY Actions secret before pushing to init."
            exit 1
          fi
      - name: Build new-tab with its persistent Chrome key
        run: bun run --filter new-tab-ext build:chrome
        env:
          REQUIRE_CHROME_KEY: "1"
          WXT_CHROME_KEY: ${{ secrets.NEW_TAB_WXT_CHROME_KEY }}
      - name: Verify the persistent Chrome key is in the build
        run: |
          node -e 'const manifest = JSON.parse(require("node:fs").readFileSync("apps/new-tab-ext/.output/chrome-mv3/manifest.json", "utf8")); if (!manifest.key) { console.error("Chrome build is missing manifest.key"); process.exit(1); }'
