name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.task }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        task: [check, typecheck, test, build, knip]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Prepare WXT types
        if: matrix.task != 'build'
        run: bun run prepare:wxt
      - run: bun run ${{ matrix.task }}

      - name: Build the credential-free Cloudflare preview bundle
        if: matrix.task == 'build'
        run: bun run --filter web build:preview-artifact

      - name: Upload the Cloudflare preview bundle
        if: matrix.task == 'build'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alchemy-worker
          path: apps/web/.output/alchemy-worker/
          if-no-files-found: error
